{% extends 'app/base.html' %}

{% block title %} Видалити автомобіль {% endblock %}

{% block content %}
    <h1>Видалити автомобіль</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_table }}
        <button type="submit" class="btn btn-delete">Видалити</button>
        <a href="{% url 'app:show_info' %}" class="btn back-link">Назад до списку</a>
    </form>

{% endblock %}
