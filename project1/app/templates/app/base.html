<html>
<head>
    <title>{% block title %} Автомобільний каталог {% endblock %}</title>
    <style>
        body {
            background: beige;
            margin: 0;
            padding: 0;
        }

        header {
            color: white;
            background: aqua;
        }

        footer {
            color: white;
            background: burlywood;
            text-align: center;
            padding: 20px;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
        }

        nav ul li {
            float: left;
        }

        nav ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #111;
        }

        a.id-link {
            color: #5c7cfa;
            font-weight: bold;
            font-size:20px;
            text-decoration: none;
        }
        a.id-link:hover {
            text-decoration: underline;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s ease, box-shadow 0.3s ease;
            display: inline-block;
        }

        .btn-add {
            background-color: #097969;
            color: white;
        }

        .btn-add:hover {
            background-color: #045449;
            box-shadow: 0 4px 10px rgba(4, 66, 57, 0.3);
        }

        a.back-link {
            background-color: #dee2e6;
            color: #0a58ca;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom:20px;
            margin-left:10px;
        }
        a.back-link:hover {
            background-color: #ced4da;
            box-shadow: 0 4px 10px rgba(171, 177, 184, 0.3);
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background-color: #bd2130;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
        }

        .btn-update {
            background-color: #6495ED;
            color: white;
        }

        .btn-update:hover {
            background-color: #3c6fc9;
            box-shadow: 0 4px 10px rgba(41, 80, 148, 0.3);
        }

        table {
            width: 50%;
            margin-bottom: 25px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #4a4a4a;
            color: white;
            text-align: left;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
        }

        td {
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        td:first-child {
            font-weight: bold;
            width: 30%;
        }



    </style>
    {%block style%} {%endblock%}
</head>
<body>
<header>
    <nav>
        <ul>
            <div><li><a href="/">Головна</a></li></div>
            <div><li><a href="/info">Каталог</a></li></div>
            <div><li><a href="/car/search">Пошук</a></li></div>
        </ul>
    </nav>
</header>

{% block content %} {% endblock %}

<footer>ITSTEP. All rights reserved. </footer>
</body>
</html>
